[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slugcatpet"
version = "0.1.2"
description = "Slugcat desktop pet for Linux (Wayland/X11): Rain World slugcat companions, bilingual (zh/en)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "lingxiaojun", email = "ljunwen49@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6>=6.10.0",
    "UnityPy>=1.23.0",
    "numpy>=2.3.0",
    # Pillow 只被 UnityPy 的贴图解码间接用到，本项目不直接 import
    "Pillow>=10.0.0",
    # Wayland 分支：GTK3 Layer Shell 桥接（还需系统包 gtk-layer-shell 及其 typelib）
    "PyGObject>=3.42",
    "pycairo>=1.20",
    # X11 分支：全局热键 XGrabKey 与 XShape 输入穿透
    "python-xlib>=0.33",
]

[project.urls]
Repository = "https://github.com/LanRhyme/slugcatpet-wayland"
Upstream = "https://github.com/lingxiaojun/slugcatpet"

[project.gui-scripts]
slugcatpet = "slugcatpet.main:main"

[tool.setuptools.packages.find]
include = ["slugcatpet*"]

[tool.setuptools.package-data]
slugcatpet = ["resources/icons/*.svg", "resources/layouts/*.json"]
